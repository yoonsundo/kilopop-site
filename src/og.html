<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600&family=Noto+Sans+KR:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0A0A0A}
.wrap{position:relative;width:1200px;height:630px;color:#fff}
.wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 70%),linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.75))}
.in{position:absolute;inset:0;z-index:2;padding:46px 56px}
.logo{display:inline-block;font-family:Anton;font-size:26px;letter-spacing:.04em;padding:4px 9px 3px;border:1px solid #fff}
.big{font-family:Anton;text-transform:uppercase;font-size:138px;line-height:.86;margin-top:34px}
.big span{display:block}.big .l1{padding-left:70px}.big .l3{padding-left:110px}
.big i{font-style:normal;color:#C8FF2E}
.ko{position:absolute;left:56px;bottom:44px;font-family:'Noto Sans KR';font-weight:800;font-size:34px;letter-spacing:-.03em}
.ko b{color:#C8FF2E}
.tag{position:absolute;right:56px;bottom:50px;font-family:Inter;font-weight:600;font-size:17px;letter-spacing:.08em;color:#E0E0DA;text-align:right;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <img src="{{hero}}" alt="">
  <div class="in">
    <span class="logo">{{EN}}</span>
    <div class="big"><span class="l1">{{l1}}</span><span>{{l2}}</span><span class="l3">{{l3}} <i>/</i></span></div>
    <p class="ko">{{line}} · <b>{{ko}}</b></p>
    <p class="tag">무료 웹앱 · 설치 없음<br>1080×1920 인스타 스토리</p>
  </div>
</div>
</body>
</html>
